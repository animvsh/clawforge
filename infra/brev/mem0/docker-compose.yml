version: '3.8'

services:
  mem0:
    image: mem0ai/mem0:latest
    container_name: mem0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mem0
      - POSTGRES_DB=mem0
    volumes:
      - mem0-data:/home/ubuntu/workspace/mem0-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: mem0-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mem0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mem0-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/workspace/mem0-data
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/workspace/mem0-data/postgres